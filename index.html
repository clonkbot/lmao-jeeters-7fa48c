<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤣</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LMAO! JEETERS 🤣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Dela+Gothic+One&family=Rubik+Glitch&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        font-family: 'Outfit', sans-serif;
        background: #0a0a0f;
        overflow-x: hidden;
      }
      .font-bangers { font-family: 'Bangers', cursive; }
      .font-dela { font-family: 'Dela Gothic One', cursive; }
      .font-glitch { font-family: 'Rubik Glitch', cursive; }
      
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-20px) rotate(10deg); }
        50% { transform: translateY(-10px) rotate(-5deg); }
        75% { transform: translateY(-25px) rotate(5deg); }
      }
      
      @keyframes shake {
        0%, 100% { transform: translateX(0) rotate(0deg); }
        25% { transform: translateX(-5px) rotate(-5deg); }
        50% { transform: translateX(5px) rotate(5deg); }
        75% { transform: translateX(-3px) rotate(-3deg); }
      }
      
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 20px rgba(255, 230, 0, 0.5), 0 0 40px rgba(255, 230, 0, 0.3); }
        50% { box-shadow: 0 0 40px rgba(255, 230, 0, 0.8), 0 0 80px rgba(255, 230, 0, 0.5); }
      }
      
      @keyframes rain {
        0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
      }
      
      @keyframes glitch {
        0%, 100% { text-shadow: 2px 2px #ff00ff, -2px -2px #00ffff; }
        25% { text-shadow: -2px 2px #ff00ff, 2px -2px #00ffff; }
        50% { text-shadow: 2px -2px #ff00ff, -2px 2px #00ffff; }
        75% { text-shadow: -2px -2px #ff00ff, 2px 2px #00ffff; }
      }
      
      @keyframes slide-in {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      
      @keyframes bounce-in {
        0% { transform: scale(0); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
      }
      
      .animate-float { animation: float 3s ease-in-out infinite; }
      .animate-shake { animation: shake 0.5s ease-in-out infinite; }
      .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
      .animate-glitch { animation: glitch 0.3s ease-in-out infinite; }
      .animate-slide-in { animation: slide-in 0.5s ease-out forwards; }
      .animate-bounce-in { animation: bounce-in 0.5s ease-out forwards; }
      
      .emoji-rain {
        position: fixed;
        font-size: 2rem;
        animation: rain linear forwards;
        pointer-events: none;
        z-index: 50;
      }
      
      .neon-text {
        text-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 40px currentColor;
      }
      
      .card-glow {
        background: linear-gradient(135deg, rgba(255, 60, 60, 0.1) 0%, rgba(255, 200, 0, 0.1) 100%);
        border: 2px solid rgba(255, 60, 60, 0.5);
        box-shadow: 0 0 30px rgba(255, 60, 60, 0.3), inset 0 0 30px rgba(255, 60, 60, 0.1);
      }
      
      .live-badge {
        background: linear-gradient(90deg, #ff0000, #ff4444);
        animation: pulse-glow 1s ease-in-out infinite;
      }
      
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #1a1a2e; }
      ::-webkit-scrollbar-thumb { background: #ff3c3c; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
